<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CognitionSync</title>
<!-- GitHub Pages cannot issue a server-side 301, so this page does the next
     best thing: a canonical tag so search engines credit the real site, plus
     an instant client-side redirect. -->
<link rel="canonical" href="https://cognitionsync.com/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://cognitionsync.com/">
<script>location.replace("https://cognitionsync.com/");</script>
</head>
<body>
<p>Redirecting to <a href="https://cognitionsync.com/">cognitionsync.com</a></p>
</body>
</html>
